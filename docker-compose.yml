services:
  # 1. Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medipulse_backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  # 2. Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medipulse_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend